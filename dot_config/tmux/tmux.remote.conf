# ~/.config/tmux/tmux.remote.conf — managed by chezmoi.
# Sourced by ~/.tmux.conf only when $SSH_CLIENT is set, i.e. this tmux server
# is running on a box reached over SSH. Purpose: make a nested session (local
# tmux -> ssh -> remote tmux) visually unambiguous.

# Push the remote bar to the BOTTOM so it stacks under the local session's top
# bar instead of colliding with it.
set -g status-position bottom

# Recolour the remote bar blue (local is orange) — instantly tells you which
# machine's tmux you're looking at, and tag the host on the right.
set -g status-style "bg=#1d2021 fg=#a89984"
set -g status-left "#[fg=#1d2021 bg=#83a598 bold] #S #[bg=default] "
set -g status-left-length 30
set -g status-right "#[fg=#a89984]%H:%M #[fg=#282828 bg=#83a598 bold]  #h "
setw -g window-status-current-style "fg=#282828 bg=#83a598 bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Optional: if you set up an SSH reverse tunnel for clipboard piping, yank.sh
# will use it. Left declared but harmless if the port isn't listening.
set -g @copy_backend_remote_tunnel_port 11988
