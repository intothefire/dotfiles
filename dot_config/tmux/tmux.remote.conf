# ~/.config/tmux/tmux.remote.conf — managed by chezmoi.
# Sourced by ~/.tmux.conf only when $SSH_CLIENT is set, i.e. this tmux server
# is running on a box reached over SSH. Purpose: make a nested session (local
# tmux -> ssh -> remote tmux) visually unambiguous.

# Bottom of the screen so it stacks under the local session's top bar.
set -g status-position bottom

# Same subtle layout as local, but a TEAL bar with GREEN accents instead of the
# local warm-grey + orange — the colour (and the bottom position) tells you at a
# glance you're driving the remote. Host is kept on the right.
set -g status-justify left
set -g status-style "bg=#204545 fg=#a89984"
set -g status-left "#{?client_prefix,#[fg=#fe8019]● ,#[fg=#8ec07c]● }#[fg=#ebdbb2 bold]#S #[default] "
set -g status-left-length 40
set -g status-right "#[fg=#517d7d]%H:%M  #[fg=#8ec07c]#h #[default]"
set -g status-right-length 40
setw -g window-status-current-style "fg=#8ec07c bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=#517d7d"
setw -g window-status-format " #I:#W "

# Optional: if you set up an SSH reverse tunnel for clipboard piping, yank.sh
# will use it. Left declared but harmless if the port isn't listening.
set -g @copy_backend_remote_tunnel_port 11988
