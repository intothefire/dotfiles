# External resources chezmoi clones into $HOME on apply.
# zsh plugins come from Homebrew (see Brewfile), not here.

# tmux plugins (no brew formulae; no TPM needed — sourced directly in ~/.tmux.conf)
[".config/tmux/plugins/tmux-resurrect"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tmux-resurrect.git"
    refreshPeriod = "168h"
[".config/tmux/plugins/tmux-continuum"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tmux-continuum.git"
    refreshPeriod = "168h"
