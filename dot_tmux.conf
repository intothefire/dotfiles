# ~/.tmux.conf — managed by chezmoi

# --- General ---
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0             # no delay for escape (vim-friendly)
set -g base-index 1               # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on        # renumber windows when one closes
set -g focus-events on
set -g set-clipboard on

# --- Truecolor ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"

# --- Keys ---
setw -g mode-keys vi
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
# splits that keep the current path; intuitive | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
# vim-style pane navigation (note: overrides prefix-l = last-window)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Copy mode → macOS clipboard (vi keys) ---
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard -i 2>/dev/null || wl-copy 2>/dev/null"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard -i 2>/dev/null || wl-copy 2>/dev/null"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard -i 2>/dev/null || wl-copy 2>/dev/null"

# --- Safer kills (confirm first) ---
bind Q confirm-before -p "kill session #S? (y/n)" kill-session
bind X confirm-before -p "kill window #W? (y/n)" kill-window

# --- F12: toggle local keys OFF so an inner/remote (SSH) tmux receives them ---
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#928374 bg=#1d2021" \;\
  set status-left "#[fg=#1d2021 bg=#928374 bold] OFF #[bg=default] " \;\
  setw window-status-current-style "fg=#928374 bg=#1d2021" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u status-left \;\
  setw -u window-status-current-style \;\
  refresh-client -S

# --- Status bar (gruvbox, matches starship) ---
set -g status-position top
set -g status-style "bg=#3c3836 fg=#ebdbb2"
set -g status-left "#{?client_prefix,#[fg=#1d2021 bg=#fe8019 bold],#[fg=#282828 bg=#d79921 bold]} #S #[bg=default] "
set -g status-left-length 30
set -g status-right "#[fg=#a89984]%H:%M #[fg=#282828,bg=#689d6a,bold] #h "
setw -g window-status-current-style "fg=#282828 bg=#d65d0e bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# --- Plugins (cloned via .chezmoiexternal.toml; no TPM) ---
# resurrect: save = prefix + Ctrl-s, restore = prefix + Ctrl-r
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
run-shell '~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
# continuum: auto-save every 15 min + auto-restore last session on server start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
run-shell '~/.config/tmux/plugins/tmux-continuum/continuum.tmux'
