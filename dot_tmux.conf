# ~/.tmux.conf — managed by chezmoi

# --- General ---
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0             # no delay for escape (vim-friendly)
set -g base-index 1               # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on        # renumber windows when one closes
set -g focus-events on
set -g set-clipboard on

# --- Truecolor ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"

# --- Prefix: Ctrl-a (was Ctrl-b) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix              # press C-a twice to send a literal C-a inward

# --- Keys ---
setw -g mode-keys vi
# reload, and edit-then-reload in $EDITOR
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind C-e new-window -n 'tmux.conf' "sh -c '\${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"Config reloaded\"'"
# splits that keep the current path; intuitive | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
# vim-style pane navigation (note: overrides prefix-l = last-window)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# window navigation (repeatable: hold the key after prefix)
bind -r Tab last-window
bind -r n next-window
bind -r p previous-window
# panes: zoom, swap
bind + resize-pane -Z
bind -r C-o swap-pane -D
# session: rename, detach-others
bind R command-prompt -I "#{session_name}" "rename-session '%%'"
bind D if -F '#{session_many_attached}' \
  'confirm-before -p "Detach other clients? (y/n)" "detach -a"' \
  'display "Session has only 1 client attached"'

# --- Copy mode → clipboard via yank.sh (OSC 52 fallback works over SSH) ---
set -g @copy_use_osc52_fallback on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$HOME/.config/tmux/yank.sh"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$HOME/.config/tmux/yank.sh"
bind -T copy-mode-vi Y send-keys -X copy-line \; run "tmux save-buffer - | $HOME/.config/tmux/yank.sh"
bind -T copy-mode-vi D send-keys -X copy-end-of-line \; run "tmux save-buffer - | $HOME/.config/tmux/yank.sh"
bind -T copy-mode-vi A send-keys -X append-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "$HOME/.config/tmux/yank.sh"
bind -T copy-mode-vi PageUp send-keys -X page-up
bind -T copy-mode-vi PageDown send-keys -X page-down
bind p paste-buffer
bind b list-buffers

# --- Safer kills (confirm first) ---
bind Q confirm-before -p "kill session #S? (y/n)" kill-session
bind X confirm-before -p "kill window #W? (y/n)" kill-window

# --- F12: toggle local keys OFF so an inner/remote (SSH) tmux receives them ---
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#928374 bg=#1d2021" \;\
  set status-left "#[fg=#1d2021 bg=#928374 bold] OFF #[bg=default] " \;\
  setw window-status-current-style "fg=#928374 bg=#1d2021" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u status-left \;\
  setw -u window-status-current-style \;\
  refresh-client -S

# --- Status bar (subtle, gruvbox; host kept) ---
# Flat coloured bar, no filled segment blocks. `●` before the session is the
# prefix indicator: aqua when idle, orange the moment prefix is active.
set -g status-position top
set -g status-justify left
set -g status-style "bg=#3c3836 fg=#a89984"
set -g status-left "#{?client_prefix,#[fg=#fe8019]● ,#[fg=#83a598]● }#[fg=#ebdbb2 bold]#S #[default] "
set -g status-left-length 40
set -g status-right "#[fg=#665c54]%H:%M  #[fg=#83a598]#h #[default]"
set -g status-right-length 40
setw -g window-status-current-style "fg=#fe8019 bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=#665c54"
setw -g window-status-format " #I:#W "

# --- Remote (SSH) overrides: bottom bar, blue, so nested sessions are distinct ---
if-shell 'test -n "$SSH_CLIENT"' 'source-file ~/.config/tmux/tmux.remote.conf'

# --- Plugins (cloned via .chezmoiexternal.toml; no TPM) ---
# resurrect: save = prefix + Ctrl-s, restore = prefix + Ctrl-r
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
run-shell '~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
# continuum: auto-save every 15 min + auto-restore last session on server start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
run-shell '~/.config/tmux/plugins/tmux-continuum/continuum.tmux'
